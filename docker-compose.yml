# Local development stack for ledger-core.
#
# Brings up the API, Postgres (event store + projections + outbox),
# RabbitMQ (integration-event transport when wired in PR #18+), and
# the OpenTelemetry collector + Grafana Tempo/Loki/Prometheus + Grafana
# UI for the dashboards the brief expects in production.
#
# Run:    docker compose up -d --build
# Health: curl http://localhost:8080/health
# UI:     http://localhost:3000  (admin / admin)

name: ledger-core

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ledger-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ledger
      RABBITMQ_DEFAULT_PASS: ledger
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: ledger-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.6.0
    container_name: ledger-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/grafana/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.2.0
    container_name: ledger-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: ledger-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ledger-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus

  ledger-api:
    build:
      context: .
      dockerfile: src/Ledger.Api/Dockerfile
    container_name: ledger-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LedgerDb: "Host=postgres;Database=ledger;Username=ledger;Password=ledger"
      Ledger__DatabaseSchema: ledger
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ledger-core
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres-data:
  prometheus-data:
